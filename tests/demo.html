<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>tw-components — demo</title>

    <link rel="stylesheet" href="../dist/tw-client.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="../dist/main.umd.js" defer></script>
  </head>
  <body class="container">
    <h1>Custom Components — Examples</h1>

    <form class="tw-form vstack gap-3" onsubmit="handleSubmit(event)">
      <div>
        <label for="form-simple">Simple input</label>
        <input
          type="simple"
          id="form-simple"
          name="form-simple"
          class="form-control"
          value="Sample"
        />
        <div class="form-text">Standard input element but wrapped in React component.</div>
      </div>

      <div>
        <label for="form-list">List Input</label>
        <input
          type="list"
          id="form-list"
          name="form-list"
          class="form-control"
          value='["uno", "dos"]'
        />
        <div class="form-text">List of strings input.</div>
      </div>

      <div>
        <label for="single-select">Single Select</label>
        <select id="single-select" name="form-select" class="form-control tw-select-group">
          <option value="">-- Please choose an option --</option>
          <option class="tw-option">Option 1</option>
          <option class="tw-option" selected>Option 2</option>
          <option class="tw-option">Option 3</option>
        </select>
        <div class="form-text">Select input with search capability.</div>
      </div>

      <div>
        <label for="multi-select">Multi Select</label>
        <select
          id="multi-select"
          name="form-multi-select"
          class="form-control tw-select-group"
          multiple
        >
          <option class="tw-option" selected>Option A</option>
          <option class="tw-option">Option B</option>
          <option class="tw-option" selected>Option C</option>
          <option class="tw-option">Option D</option>
        </select>
        <div class="form-text">Multi-select input with search capability.</div>
      </div>

      <hr />

      <div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>
    </form>
  </body>

  <script>
    function handleSubmit(event) {
      event.preventDefault();
      console.log(event.formData);
    }
  </script>
</html>
