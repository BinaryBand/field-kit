<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Prism.js CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />

    <!-- Custom responsive styles -->
    <style>
      @media only screen and (max-width: 720px) {
        tr.calendar-header {
          display: none !important;
        }
      }
    </style>

    <!-- Prism.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Prism.js Components -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <!-- Prism.js Copy to Clipboard Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Prism.js Normalize Whitespace Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/normalize-whitespace/prism-normalize-whitespace.min.js"></script>
  </head>

  <body data-bs-theme="dark">
    <main class="container py-4">
      <div class="mx-auto" style="max-width: 800px">
        <header class="text-center mb-5">
          <h1>TW Demo</h1>
          <p class="text-muted">Custom Components Showcase</p>
        </header>

        <form class="tw-form" onsubmit="handleSubmit(event)">
          <!---------------------------------------------------------------------->

          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">Single-Select Component</h5>
            </div>

            <div class="card-body">
              <select
                class="form-control tw-select-group"
                name="SingleSelect"
                data-placeholder="Choose items from groups..."
              >
                <option class="tw-option" value="salt">Salt</option>
                <option class="tw-option" value="pepper" selected>Pepper</option>
                <option class="tw-option" value="olive-oil">Olive Oil</option>
              </select>

              <div
                class="code-demo"
                data-target="select.tw-select-group[name='SingleSelect']"
                data-language="html"
              ></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">Multi-Select Component</h5>
            </div>

            <div class="card-body">
              <select
                class="form-control tw-select-group"
                multiple
                name="MultiSelect"
                data-placeholder="Choose items from groups..."
              >
                <option class="tw-option" value="salt">Salt</option>
                <option class="tw-option" value="pepper" selected>Pepper</option>
                <option class="tw-option" value="olive-oil">Olive Oil</option>
              </select>

              <div
                class="code-demo"
                data-target="select.tw-select-group[name='MultiSelect']"
                data-language="html"
              ></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">Grouped Select Component</h5>
            </div>

            <div class="card-body">
              <select
                class="form-control tw-select-group"
                multiple
                name="GroupedSelect"
                data-placeholder="Choose items from groups..."
              >
                <option class="tw-option" value="apple" data-group="Fruits">Apple</option>
                <option class="tw-option" value="banana" data-group="Fruits">Banana</option>
                <option class="tw-option" value="orange" data-group="Fruits">Orange</option>
                <option class="tw-option" value="strawberry" data-group="Fruits">Strawberry</option>

                <option class="tw-option" value="carrot" data-group="Vegetables" selected>
                  Carrot
                </option>
                <option class="tw-option" value="broccoli" data-group="Vegetables">Broccoli</option>
                <option class="tw-option" value="spinach" data-group="Vegetables">Spinach</option>
                <option class="tw-option" value="tomato" data-group="Vegetables">Tomato</option>

                <option class="tw-option" value="chicken" data-group="Proteins">Chicken</option>
                <option class="tw-option" value="beef" data-group="Proteins" selected>Beef</option>
                <option class="tw-option" value="salmon" data-group="Proteins">Salmon</option>
                <option class="tw-option" value="tofu" data-group="Proteins" selected>Tofu</option>
              </select>

              <div
                class="code-demo"
                data-target="select.tw-select-group[name='GroupedSelect']"
                data-language="html"
              ></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <footer class="text-center mt-5">
            <button class="btn btn-primary" type="submit">Test TW Components</button>
          </footer>
        </form>
      </div>
    </main>

    <script src="/scripts.js" type="module"></script>
    <script type="module" src="/src/index.tsx"></script>

    <script>
      function handleSubmit(event) {
        event.preventDefault();
        console.log(event.formData);
      }
    </script>
  </body>
</html>
