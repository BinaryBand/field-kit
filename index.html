<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <link href="/styles.scss" rel="stylesheet" />
    <script defer src="/scripts.js" type="module"></script>
  </head>

  <body data-bs-theme="dark">
    <template id="code-demo-template">
      <hr />

      <div class="bg-body-secondary my-2 p-2 rounded">
        <code class="code-demo__code"></code>

        <button class="btn code-demo__copy" type="button">
          <i class="bi bi-copy"></i>
        </button>
      </div>
    </template>

    <template id="select-option-template">
      <option class="tw-option" value="26">Albuquerque</option>
      <option class="tw-option" value="1">Austin</option>
      <option class="tw-option" value="2">Charlotte</option>
      <option class="tw-option" value="24">Chattanooga</option>
      <option class="tw-option" value="33">Columbus</option>
      <option class="tw-option" value="10">Corporate</option>
      <option class="tw-option" value="20">Corpus Christi</option>
    </template>

    <form
      action="https://google.com/"
      class="container list py-3 tw-form"
      method="post"
      onsubmit="handleSubmit(event)"
    >
      <div class="row">
        <div class="col-12 offset-lg-3 col-lg-6 d-flex flex-column gap-4">
          <div aria-label="TW Components" class="text-center">
            <h1>TW Components</h1>
            <p>This extends</p>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">List Filter</h5>
            </div>

            <div class="card-body">
              <div class="vstack gap-2 tw-filter-group">
                <input class="form-control" placeholder="Text Filter" type="filter" />

                <ul class="list-group">
                  <li class="list-group-item tw-filter-item">An item</li>
                  <li class="list-group-item tw-filter-item">A second item</li>
                  <li class="list-group-item tw-filter-item">A third item</li>
                </ul>
              </div>

              <div class="code-demo" data-target="div.tw-filter-group"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">List Input</h5>
            </div>

            <div class="card-body">
              <input class="form-control" name="ListInput" placeholder="List Input" type="list" />
              <div class="code-demo" data-target="input[type='list']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Select</h5>
            </div>

            <div class="card-body">
              <select
                class="tw-select-group form-control"
                data-placeholder="Single Select"
                name="SingleSelect"
                type="number"
              ></select>

              <div class="code-demo" data-target="select[name='SingleSelect']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Multi-Select</h5>
            </div>

            <div class="card-body">
              <select
                class="tw-select-group form-control"
                data-placeholder="Multiselect"
                multiple
                name="Multiselect"
                type="number"
              ></select>

              <div class="code-demo" data-target="select[name='Multiselect']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Auto-Resize Textarea</h5>
            </div>

            <div class="card-body">
              <textarea
                class="tw-auto-resize form-control"
                name="Multiline"
                placeholder="Multiline"
              ></textarea>

              <div class="code-demo" data-target="textarea.tw-auto-resize"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">PIN Input</h5>
            </div>

            <div class="card-body">
              <input class="form-control" data-size="6" name="Pin" placeholder="0000" type="pin" />
              <div class="code-demo" data-target="input[type='pin']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Auto-Resize Textarea</h5>
            </div>

            <div class="card-body">
              <input
                class="form-control"
                name="SignatureInput"
                placeholder="Sign Here"
                type="signature"
              />

              <button
                class="btn btn-outline-danger ms-auto"
                id="clear-signature-button"
                type="button"
              >
                Clear Signature
              </button>

              <div class="code-demo" data-target="input[type='signature']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Passkey Input</h5>
            </div>

            <div class="card-body">
              <input
                class="btn btn-outline-secondary"
                data-identifier="sh@ne.com"
                data-user="Shane"
                name="Passkey"
                type="passkey"
              />

              <div class="code-demo" data-target="input[type='passkey']"></div>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <div class="card">
            <div class="card-header">
              <h5 class="card-title">Calendar</h5>
            </div>

            <div class="card-body">
              <table class="table tw-calendar">
                <tr class="calendar-header">
                  <th>Sunday</th>
                  <th>Monday</th>
                  <th>Tuesday</th>
                  <th>Wednesday</th>
                  <th>Thursday</th>
                  <th>Friday</th>
                  <th>Saturday</th>
                </tr>

                <tr class="tw-calendar-month" data-tw-year="2021" data-tw-month="7">
                  <td class="tw-calendar-day" data-tw-day="1">
                    <div class="small text-secondary">First</div>
                  </td>
                  <td class="tw-calendar-day" data-tw-day="31">
                    <div class="small text-secondary">Second</div>
                  </td>
                  <td class="tw-calendar-day" data-tw-day="5">
                    <div class="small text-secondary">Third</div>
                  </td>
                </tr>
              </table>
            </div>
          </div>

          <!---------------------------------------------------------------------->

          <span hidden>End</span>
        </div>
      </div>

      <div>
        <button class="btn btn-primary" type="submit">Submit</button>
      </div>
    </form>
  </body>

  <script>
    function handleSubmit(event) {
      event.preventDefault();

      console.log(event.formData);
    }
  </script>
</html>
