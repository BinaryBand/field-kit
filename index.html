<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite + React + TS</title>

  <link href="/styles.scss" rel="stylesheet">
  <script defer src="/scripts.ts" type="module"></script>
</head>

<body>
  <template id="code-demo-template">
    <hr />

    <div class="bg-body-secondary my-2 p-2 rounded vstack">
      <code class="code-demo__code"></code>
      <div class="d-flex justify-content-end">
        <button class="btn code-demo__copy">Copy</button>
      </div>
    </div>
  </template>

  <div class="container list my-3">
    <div class="list-item">
      <div id="list-input-container" class="d-flex flex-nowrap gap-2">
        <input placeholder="List Input" type="list" />
      </div>

      <div class="code-demo" data-target="input[type='list']"></div>
    </div>

    <div class="list-item">
      <select class='tw-select-group form-control' id='office-select'>
        <option class='tw-option'>Open this to select an office</option>
        <option class='tw-option' value='26'>Albuquerque</option>
        <option class='tw-option' value='1'>Austin</option>
        <option class='tw-option' selected value='2'>Charlotte</option>
        <option class='tw-option' value='24'>Chattanooga</option>
        <option class='tw-option' value='33'>Columbus</option>
        <option class='tw-option' value='10'>Corporate</option>
        <option class='tw-option' value='20'>Corpus Christi</option>
      </select>
    </div>

    <div class="list-item">
      <textarea class="tw-auto-resize" placeholder="Multiline"></textarea>
      <div class="code-demo" data-target="textarea.tw-auto-resize"></div>
    </div>

    <div class="list-item">
      <input placeholder="Sign Here" type="signature" />

      <div class="d-flex my-1">
        <button class="btn ms-auto" id="clear-signature-button">Clear Signature</button>
      </div>

      <div class="code-demo" data-target="input[type='signature']"></div>
    </div>

    <div class="list-item">
      <input placeholder="Upload an image here" type="img" />
      <div class="code-demo" data-target="input[type='img']"></div>
    </div>

    <div class="list-item">
      <table class='table tw-calendar' width='100%'>
        <tr>
          <th>Sunday</th>
          <th>Monday</th>
          <th>Tuesday</th>
          <th>Wednesday</th>
          <th>Thursday</th>
          <th>Friday</th>
          <th>Saturday</th>
        </tr>

        <tr class='tw-calendar-month' data-tw-year='2021' data-tw-month='7'>
          <td class='tw-calendar-day' data-tw-day='1'>
            <div class="small text-secondary">8:00 AM-4:00 PM</div>
            <div>8 Hours</div>
          </td>
          <td class='tw-calendar-day' data-tw-day='3'>
            <div class="small text-secondary">8:00 AM-5:00 PM</div>
            <div>9 Hours</div>
          </td>
          <td class='tw-calendar-day' data-tw-day='4'>
            <div class="small text-secondary">11:00 AM-5:00 PM</div>
            <div>6 Hours</div>
          </td>
          <td class='tw-calendar-day' data-tw-day='7'>
            <div class="small text-secondary">8:00 AM-5:00 PM</div>
            <div>9 Hours</div>
          </td>
          <td class='tw-calendar-day' data-tw-day='5'>
            <div class="small text-secondary">8:00 AM-5:00 PM</div>
            <div>9 Hours</div>
          </td>
          <td class='tw-calendar-day' data-tw-day='31'>
            <div class="small text-secondary">8:00 AM-5:00 PM</div>
            <div>9 Hours</div>
          </td>
        </tr>
      </table>
    </div>
  </div>

  <div class="container d-none my-3">
    <input type="editor" />
  </div>
</body>

</html>
