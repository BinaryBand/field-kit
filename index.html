<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React + TS</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Prism.js CSS -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css"
      rel="stylesheet"
    />

    <!-- Custom responsive styles -->
    <style>
      @media only screen and (max-width: 720px) {
        tr.calendar-header {
          display: none !important;
        }
      }
    </style>

    <!-- Prism.js Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

    <!-- Prism.js Components -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup-templating.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>

    <!-- Prism.js Copy to Clipboard Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/copy-to-clipboard/prism-copy-to-clipboard.min.js"></script>

    <!-- Prism.js Normalize Whitespace Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/normalize-whitespace/prism-normalize-whitespace.min.js"></script>
  </head>

  <body data-bs-theme="dark">
    <main class="container py-4">
      <div class="mx-auto" style="max-width: 800px">
        <header class="text-center mb-5">
          <h1>TW Demo</h1>
          <p class="text-muted">Custom Components Showcase</p>
        </header>

        <form class="tw-form" onsubmit="handleSubmit(event)">
          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">Select</h5>
            </div>

            <div class="card-body">
              <select
                class="tw-select-group form-control"
                data-placeholder="Single Select"
                multiple
                name="SingleSelect"
                type="number"
              >
                <option class="tw-option" value="1">Albuquerque</option>
                <option class="tw-option" value="2">Boston</option>
                <option class="tw-option" selected value="3">Chicago</option>
                <option class="tw-option" disabled value="4">Denver</option>
                <option class="tw-option" value="5">El Paso</option>
                <option class="tw-option" value="6">Flagstaff</option>
                <option class="tw-option" value="7">Gilbert</option>
              </select>
            </div>
          </div>

          <!--------------------------------------------------->

          <div class="card mb-4">
            <div class="card-header">
              <h5 class="card-title">Grouped</h5>
            </div>

            <div class="card-body">
              <select class="tw-test form-control" multiple name="Test" data-placeholder="Group">
                <option class="tw-option2" value="1" data-tw-group="first">ett</option>
                <option class="tw-option2" value="2" data-tw-group="first">två</option>
                <option class="tw-option2" value="3" data-tw-group="second">tre</option>
                <option class="tw-option2" value="4">fyra</option>
              </select>
            </div>

            <div class="code-demo" data-target="tw-calendar-month[name='CalendarInput']"></div>
          </div>

          <!--------------------------------------------------->

          <footer class="text-center mt-5">
            <button class="btn btn-primary">Submit</button>
          </footer>
        </form>
      </div>
    </main>

    <script src="/scripts.js" type="module"></script>
    <script type="module" src="/src/index.tsx"></script>

    <script>
      function handleSubmit(event) {
        event.preventDefault();
        console.log(event.formData);
      }
    </script>
  </body>
</html>
